<!DOCTYPE html>
<html>

<head lang="en">
    <title>Active Timer Settings</title>
    <meta charset="utf-8" />
    <!-- Vendored locally (not loaded from the CDN at runtime) — see CLAUDE.md "Stream Deck quirks" for why. -->
    <script src="vendor/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
        "global" fields below persist to the plugin's global settings and are shared by every key.
    -->

    <sdpi-item label="Awork Client ID">
        <sdpi-textfield setting="oauthClientId" global placeholder="Paste your awork client ID"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item>
        <small>Create an API client in awork under Settings &rarr; Integrations &rarr; API Clients, with redirect URI http://127.0.0.1:52305/callback.</small>
    </sdpi-item>

    <sdpi-item label="Awork Account">
        <sdpi-button id="connect-button" onclick="connectToAwork()">Connect to Awork</sdpi-button>
    </sdpi-item>
    <sdpi-item>
        <small id="connect-status">Not connected yet.</small>
    </sdpi-item>

    <sdpi-item label="Poll Interval (s)">
        <sdpi-range setting="pollIntervalSeconds" global min="10" max="120" step="5" default="20" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Time Format">
        <sdpi-select setting="timeFormat" default="h:mm:ss">
            <option value="h:mm:ss">h:mm:ss</option>
            <option value="h:mm">h:mm</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Running Color">
        <sdpi-color setting="colorRunning" default="#14532d"></sdpi-color>
    </sdpi-item>

    <sdpi-item label="Paused Color">
        <sdpi-color setting="colorPaused" default="#78350f"></sdpi-color>
    </sdpi-item>

    <sdpi-item label="Stopped Color">
        <sdpi-color setting="colorStopped" default="#1f2937"></sdpi-color>
    </sdpi-item>

    <sdpi-item label="Idle Color">
        <sdpi-color setting="colorIdle" default="#0f172a"></sdpi-color>
    </sdpi-item>

    <sdpi-item label="Error Color">
        <sdpi-color setting="colorError" default="#7f1d1d"></sdpi-color>
    </sdpi-item>

    <sdpi-item label="Short Press">
        <sdpi-select setting="shortPressAction" default="pause-resume">
            <option value="pause-resume">Pause / Resume</option>
            <option value="stop">Stop</option>
            <option value="none">None</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Long Press">
        <sdpi-select setting="longPressAction" default="stop">
            <option value="pause-resume">Pause / Resume</option>
            <option value="stop">Stop</option>
            <option value="none">None</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Long Press Threshold (ms)">
        <sdpi-range setting="longPressThresholdMs" min="200" max="2000" step="50" default="600" showlabels></sdpi-range>
    </sdpi-item>

    <script>
        function connectToAwork() {
            document.getElementById("connect-status").textContent = "Opening awork in your browser…";
            SDPIComponents.streamDeckClient.send("sendToPlugin", { event: "connectAwork" });
        }

        // SDPIComponents.streamDeckClient.sendToPropertyInspector may not be initialized yet at
        // script-load time (it depends on the PI's websocket handshake completing) even though
        // .send() already works by the time a user clicks a button seconds later — poll briefly
        // rather than assume a fixed timing.
        (function subscribeWhenReady() {
            const client = window.SDPIComponents && window.SDPIComponents.streamDeckClient;
            if (client && client.sendToPropertyInspector) {
                client.sendToPropertyInspector.subscribe((ev) => {
                    const payload = ev.payload || {};
                    if (payload.event !== "connectAwork") {
                        return;
                    }
                    document.getElementById("connect-status").textContent = payload.ok
                        ? `Connected as ${payload.name}.`
                        : `Connection failed: ${payload.error}`;
                });
            } else {
                setTimeout(subscribeWhenReady, 50);
            }
        })();
    </script>

</body>

</html>
